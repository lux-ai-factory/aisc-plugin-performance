[project]
name = "predictive-insights"
version = "0.2.2"
description = "Plugin for evaluating model performance metrics"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aisc-plugin-interface>=0.4.0",
    "numpy>=2.4.1",
    "onnxruntime>=1.23.2",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
]

[dependency-groups]
dev = [
    "pre-commit>=4.5.1",
    "pyarrow>=23.0.1",
    "pytest>=9.0.2",
    "ruff>=0.15.7",
    "skl2onnx>=1.20.0",
    "ty>=0.0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
# our 0.4.0, built from the AISC repo's shared/plugin-interface by the AISC repo's scripts/vendor-plugin-interface.sh: PyPI's latest, 0.3.0, has no assesses, helpers or connections
aisc-plugin-interface = { path = "vendor/aisc_plugin_interface-0.4.0-py3-none-any.whl" }
